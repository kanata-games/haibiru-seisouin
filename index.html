<script>
// ================= データ定義 =================
const ITEMS={
 scrap:{n:'鉄くず',c:'#aab',g:'⚙',t:'mat'},wire:{n:'電線',c:'#e83',g:'∿',t:'mat'},wood:{n:'木片',c:'#b85',g:'▬',t:'mat'},
 cloth:{n:'ボロ布',c:'#ddb',g:'≋',t:'mat'},gear:{n:'歯車',c:'#fd5',g:'✲',t:'mat'},
 sTurnip:{n:'カブの種',c:'#cfc',g:'·',t:'seed',crop:'turnip',days:3},sTomato:{n:'トマトの種',c:'#fcc',g:'·',t:'seed',crop:'tomato',days:4},
 turnip:{n:'カブ',c:'#fff',g:'●',t:'crop'},tomato:{n:'トマト',c:'#f44',g:'●',t:'crop'},
 herb:{n:'怪しい薬草',c:'#5f5',g:'"',t:'food',heal:8},bento:{n:'賞味期限切れ弁当',c:'#fa6',g:'%',t:'food',heal:15},
 niboshi:{n:'煮干し',c:'#9bd',g:'~',t:'lure'},
 can:{n:'空き缶',c:'#ccc',g:'c',t:'junk'},doll:{n:'首の取れた人形',c:'#f9c',g:'&',t:'junk'},tv:{n:'ブラウン管テレビ',c:'#8cf',g:'▣',t:'junk'},
 plant:{n:'枯れた観葉植物',c:'#7c5',g:'♣',t:'junk'},helmet:{n:'工事ヘルメット',c:'#fd3',g:'∩',t:'junk'},sign:{n:'「立入禁止」の札',c:'#f55',g:'▤',t:'junk'},
 maneki:{n:'招き猫(片手)',c:'#fff',g:'☻',t:'junk'},
 pipe:{n:'鉄パイプ',c:'#bbc',g:'/',t:'tool',atk:2},mop:{n:'改造モップ',c:'#6cf',g:'†',t:'tool',atk:4},
 stool:{n:'木のスツール',c:'#c96',g:'π',t:'junk'},neon:{n:'ネオン看板「営業中」',c:'#f6f',g:'▦',t:'junk'},clock:{n:'歯車時計',c:'#fd5',g:'◷',t:'junk'},
 jarashi:{n:'猫じゃらし',c:'#ef8',g:'ψ',t:'lure'},
 soup:{n:'カブのスープ',c:'#ffd',g:'◒',t:'food',heal:25},stew:{n:'トマトのカブ煮',c:'#f86',g:'◓',t:'food',heal:40,maxhp:2}};
const PRICE={turnip:15,tomato:25,soup:40,stew:60,stool:30,neon:50,clock:45,pipe:20,mop:40,jarashi:15,gear:8,wire:5,scrap:3,wood:3,cloth:3};const price=k=>PRICE[k]||5;
const LOOT=['scrap','scrap','wire','wood','wood','cloth','gear','sTurnip','sTomato','herb','bento','niboshi','can','doll','tv','plant','helmet','sign','maneki'];
const RECIPES=[
 {out:'pipe',need:{scrap:2},d:'武器(攻+2)'},{out:'mop',need:{pipe:1,cloth:1,wire:1},d:'武器(攻+4)'},
 {out:'stool',need:{wood:2},d:'家具'},{out:'neon',need:{wire:2,scrap:1},d:'家具'},{out:'clock',need:{gear:2,wood:1},d:'家具'},
 {out:'jarashi',need:{cloth:1,wood:1},d:'動物を確実に手なずける'},
 {out:'soup',need:{turnip:2},d:'料理 HP+25'},{out:'stew',need:{tomato:1,turnip:1},d:'料理 HP+40 最大HP+2'}];
const MONS=[
 {n:'ネズミ',s:'rat',hp:4,atk:1,tier:0},{n:'コウモリ',s:'bat',hp:3,atk:2,tier:0,erratic:1},
 {n:'ホコリ玉',s:'dust_bunny',hp:7,atk:2,tier:1},{n:'すねこすり',s:'sunekosuri',hp:8,atk:2,tier:1},{n:'空き缶のつくも神',s:'can_tsukumogami',hp:9,atk:3,tier:1},
 {n:'小豆洗い',s:'azukiarai',hp:13,atk:4,tier:2},{n:'からかさお化け',s:'kasa_obake',hp:12,atk:4,tier:2,erratic:1},{n:'家鳴り',s:'yanari',hp:16,atk:4,tier:2},{n:'呪いの自販機',s:'cursed_vending',hp:18,atk:5,tier:2},
 {n:'ろくろ首',s:'rokurokubi',hp:22,atk:6,tier:3},{n:'口裂け女',s:'kuchisake_onna',hp:20,atk:7,tier:3},{n:'ネオン幽霊',s:'neon_ghost',hp:24,atk:6,tier:3}];
const ANIMALS=[{n:'野良猫',s:'stray_cat',hp:6,atk:2,tame:1},{n:'野良犬',s:'stray_dog',hp:9,atk:3,tame:1}];
const tierOf=d=>d<=2?0:d<=4?1:d<=6?2:3;
// 町と家の固定の飾り(状態に入れないので古いセーブにも出る)
const PROPS={town:[{s:'flowerbed_pink',x:3,y:7},{s:'flowerbed_yellow',x:4,y:7},{s:'flower_pot',x:5,y:7},{s:'home_mailbox',x:8,y:7},{s:'flowerbed_mix',x:11,y:7},{s:'flowerbed_lavender',x:12,y:7},
 {s:'ajisai',x:2,y:10},{s:'ajisai',x:2,y:11},{s:'flower_pot',x:14,y:13},{s:'ajisai',x:21,y:17}],
 home:[{s:'furin',x:9,y:1},{s:'teru_teru',x:11,y:1},{s:'engawa_cat',x:2,y:7,w:2}]};
const propAt=(mid,x,y)=>(PROPS[mid]||[]).find(o=>y==o.y&&x>=o.x&&x<o.x+(o.w||1));
const NPC_DEF={
 mitsuko:{n:'隣人のミツコ',hair:'#ddd',cl:'#c6c',lines:['あら清掃員さん。廃ビルの5階にはね、あたしの入れ歯があるの。たぶん。','ネズミはね、炒めるとちょっとだけ美味しいのよ。ちょっとだけね。','カブは話しかけると甘くなるのよ。あたしは毎晩カブと口論してるわ。','あんたが倒れたら、またあたしが引きずってあげる。腰が痛いけど。']},
 gonza:{n:'自称哲学者ゴンザ',hair:'#555',cl:'#6a6',lines:['存在とは…モップである。','わしは昨日、自分の影に負けた。','空き缶を3つ集めると、何も起きない。真理だ。','トマトは野菜か果物か。わしは考えるのをやめた。']},
 tanekichi:{n:'種屋のタネ吉',hair:'#a62',cl:'#4a4',lines:['種はいいぞ。黙っていても育つ。おれと違って。','今日の種だ。持ってけ！…代金？ 笑顔でいい。','この種、たまに歌う。気にするな。']},
 posuko:{n:'郵便配達のポス子',hair:'#222',cl:'#d33',lines:['お届け物でーす！…あれ、宛先が「宇宙」になってる。','この町、住所が全部「だいたいこのへん」なんですよね。','掲示板の依頼、こなすと町の人が少しだけ優しくなりますよ。たぶん。']},
 yuusha:{n:'元勇者の八百屋',hair:'#fd3',cl:'#36c',lines:['昔は魔王を倒した。今はカブを並べている。どっちも大事だ。','その武器…いい手入れだ。モップか？ モップだな。','剣は錆びたが、カブを見る目は錆びてない。']}};
const VISITORS=[{n:'謎のセールスマン',hair:'#000',cl:'#555',line:'この壺を買うと…いえ、差し上げます。重いので。',gift:'tv',s:'salesman'},
 {n:'迷子の宇宙人',hair:'#6f6',cl:'#9cf',line:'ワレワレハ…カブヲ…モトメテイル…いや、やっぱりいいです。',gift:'gear',s:'alien'},
 {n:'放浪の吟遊詩人',hair:'#c84',cl:'#a5a',line:'♪清掃員〜 掃いても掃いても〜 廃ビル〜♪ お礼にこれを。',gift:'wire',s:'bard'},
 {n:'となり町の猫',hair:'#e94',cl:'#e94',line:'にゃ。(何かを置いて帰っていった)',gift:'niboshi',s:'stray_cat'}];
// ================= 乱数・マップ生成 =================
function rng(s){s.seed=(s.seed*1103515245+12345)&0x7fffffff;return s.seed/0x7fffffff}
function ri(s,n){return Math.floor(rng(s)*n)}
const BLOCK='#T~WbBHPVKRXs';
function grid(w,h,c){return Array.from({length:h},()=>Array(w).fill(c))}
function homeMap(){const w=14,h=10,g=grid(w,h,'.');for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(!x||!y||x==w-1||y==h-1)g[y][x]='#';
 for(let x=2;x<w-1;x+=3)g[0][x]='s';g[2][2]='b';g[2][5]='W';g[h-1][7]='D';return{name:'自宅',w,h,grid:g,mons:[],items:[],depth:0,links:{'7,9':{to:'town',x:6,y:7}}}}
function townMap(s){const w=40,h=28,g=grid(w,h,',');
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!x||!y||x==w-1||y==h-1)g[y][x]='T';else if(rng(s)<.03)g[y][x]='T'}
 const rect=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=c};
 rect(1,14,38,15,'=');rect(6,7,7,13,'=');rect(33,10,34,13,'=');rect(19,16,20,26,'=');
 rect(3,2,10,6,'H');g[6][6]='D';
 rect(2,8,5,12,',');rect(8,8,12,12,'g');g[7][9]='X';
 rect(1,13,5,13,'K');rect(8,13,13,13,'K');
 rect(30,2,37,9,'#');g[9][33]='>';
 rect(10,18,16,23,'~');rect(23,18,36,25,'R');rect(28,18,28,25,',');
 for(let x=3;x<38;x+=7)if(g[16][x]==',')g[16][x]='P';
 g[13][17]='V';g[13][18]='V';rect(14,4,22,9,',');g[13][15]='B';
 return{name:'町はずれ',w,h,grid:g,mons:[],items:[],depth:0,outdoor:1,links:{'6,6':{to:'home',x:7,y:8},'33,9':{to:'b1'}}}}
function genFloor(s,d){const w=30,h=22,g=grid(w,h,'#'),rooms=[];
 for(let i=0;i<80&&rooms.length<8;i++){const rw=4+ri(s,6),rh=3+ri(s,4),x=1+ri(s,w-rw-2),y=1+ri(s,h-rh-2);
  if(rooms.some(r=>x<r.x+r.w+1&&x+rw+1>r.x&&y<r.y+r.h+1&&y+rh+1>r.y))continue;rooms.push({x,y,w:rw,h:rh});
  for(let yy=y;yy<y+rh;yy++)for(let xx=x;xx<x+rw;xx++)g[yy][xx]='.'}
 const c=r=>[r.x+(r.w>>1),r.y+(r.h>>1)];
 for(let i=1;i<rooms.length;i++){let[a,b]=c(rooms[i-1]),[e,f]=c(rooms[i]);
  while(a!=e){g[b][a]='.';a+=Math.sign(e-a)}while(b!=f){g[b][a]='.';b+=Math.sign(f-b)}}
 const free=()=>{for(;;){const x=1+ri(s,w-2),y=1+ri(s,h-2);if(g[y][x]=='.')return[x,y]}};
 const[ux,uy]=c(rooms[0]);g[uy][ux]='<';const[dx,dy]=c(rooms[rooms.length-1]);g[dy][dx]='>';
 const mons=[],items=[];
 const tr=tierOf(d);for(let i=0;i<4+d;i++){const t=tr>0&&rng(s)<.3?tr-1:tr,pool=MONS.filter(o=>o.tier==t),m=pool[ri(s,pool.length)],[x,y]=free();
  const b=Math.max(0,d-1-t*2);mons.push({...m,x,y,maxhp:m.hp+b,hp:m.hp+b,atk:m.atk+(b>>1)})}
 if(rng(s)<.6){const a=ANIMALS[ri(s,2)],[x,y]=free();mons.push({...a,x,y,maxhp:a.hp,hp:a.hp})}
 for(let i=0;i<5+ri(s,4);i++){const[x,y]=free();items.push({k:LOOT[ri(s,LOOT.length)],x,y})}
 const links={};links[ux+','+uy]=d==1?{to:'town',x:33,y:10}:{to:'b'+(d-1),down:1};links[dx+','+dy]={to:'b'+(d+1)};
 return{name:'廃ビル B'+d+'F',w,h,grid:g,mons,items,depth:d,up:[ux,uy],dn:[dx,dy],links}}
// ================= 状態 =================
function newState(name,seed,look){const s={ver:4,events:[],t:0,shipped:[],seed:seed||(Date.now()&0xffffff),day:1,time:360,turn:0,gold:0,maps:{home:homeMap()},decor:[],codex:{},farm:{},quest:null,
 npcs:[{id:'mitsuko',map:'town',x:12,y:16},{id:'gonza',map:'town',x:17,y:6},{id:'tanekichi',map:'town',x:11,y:16},{id:'posuko',map:'town',x:16,y:13},{id:'yuusha',map:'town',x:22,y:16}],
 allies:[],log:['ようこそ。ここはあなたの家だ。外に出ると庭と町がある。'],players:[]};
 s.maps.town=townMap(s);s.players.push(newPlayer('p1',name||'清掃員カナタ',look));newQuest(s);return s}
function newPlayer(id,name,look){return{id,name,look:look||{...DEFAULT_LOOK},dir:'down',map:'home',x:7,y:6,hp:20,maxhp:20,atk:3,lv:1,exp:0,wpn:null,inv:['sTurnip','sTurnip','sTomato'],talk:{},seedDay:0}}
const log=(s,m)=>{s.log.push(m);if(s.log.length>60)s.log.shift()};
const npcName=n=>n.vis?n.vis.n:NPC_DEF[n.id].n;
const occupant=(s,mid,x,y)=>s.npcs.find(n=>n.map==mid&&n.x==x&&n.y==y)||s.allies.find(a=>!a.down&&a.map==mid&&a.x==x&&a.y==y)||s.players.find(p=>p.map==mid&&p.x==x&&p.y==y)||s.maps[mid].mons.find(e=>e.x==x&&e.y==y);
function blocked(s,mid,x,y){const m=s.maps[mid];if(x<0||y<0||x>=m.w||y>=m.h||BLOCK.includes(m.grid[y][x]))return true;
 if(s.decor.some(d=>d.map==mid&&d.x==x&&d.y==y)||propAt(mid,x,y))return true;return!!occupant(s,mid,x,y)}
function ensureMap(s,id){if(!s.maps[id])s.maps[id]=genFloor(s,+id.slice(1));return s.maps[id]}
function placeNear(s,mid,x,y){for(let r=1;r<4;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(!blocked(s,mid,x+dx,y+dy)&&!s.maps[mid].links[(x+dx)+','+(y+dy)])return[x+dx,y+dy];return[x,y]}
function goMap(s,p,link){const m=ensureMap(s,link.to);p.map=link.to;
 if(link.x!=null){p.x=link.x;p.y=link.y}else if(link.down){p.x=m.dn[0];p.y=m.dn[1]}else{p.x=m.up[0];p.y=m.up[1]}
 if(link.to=='home'||link.to=='town'){p.x=link.x;p.y=link.y}
 for(const a of s.allies)if(a.owner==p.id&&!a.down){a.map=p.map;const[x,y]=placeNear(s,p.map,p.x,p.y);a.x=x;a.y=y}
 log(s,m.name+'に着いた。')}
const hhmm=t=>String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function newQuest(s){const ks=['scrap','wire','wood','gear','turnip','tomato','cloth'],k=ks[ri(s,ks.length)],ids=Object.keys(NPC_DEF),from=ids[ri(s,ids.length)];
 s.quest={k,n:1+ri(s,3),from,reward:10+ri(s,20)}}
function sleep(s,p,passout){s.day++;if(s.shipped&&s.shipped.length){const g=s.shipped.reduce((a,k)=>a+price(k),0);s.gold+=g;log(s,'出荷箱の中身が '+g+'G になっていた。');s.shipped=[]}s.time=360;p.hp=p.maxhp;
 for(const a of s.allies){a.down=false;a.hp=a.maxhp;if(a.owner==p.id){a.map=p.map;const[x,y]=placeNear(s,p.map,p.x,p.y);a.x=x;a.y=y}}
 for(const f of Object.values(s.farm))if(f.crop){if(f.water){f.days++;}f.water=false}else f.water=false;
 s.npcs=s.npcs.filter(n=>!n.vis);log(s,passout?'限界だ…その場で倒れるように眠った。':'ぐっすり眠った。');log(s,'— '+s.day+'日目の朝 —');
 if(!s.quest||rng(s)<.4)newQuest(s);
 const r=rng(s);
 if(r<.3){const v=VISITORS[ri(s,VISITORS.length)];const[x,y]=placeNear(s,'home',7,8);s.npcs.push({id:'vis',vis:v,map:'home',x,y});log(s,'コンコン。誰かが家に来ているようだ…')}
 else if(r<.45){let n=0;for(const f of Object.values(s.farm))if(f.crop){f.days++;n++}log(s,n?'夜中に誰かが畑のカブを撫でていったらしい。作物が少し育った。':'夜中に誰かが庭をうろついていた気がする。')}
 else if(r<.6)log(s,'ポストに手紙。「拝啓 清掃員様。あなたのモップさばきに惚れました。—廃ビルのネズミより」');
 else if(r<.72){const g=s.npcs.find(n=>n.id=='gonza');g.x=6;g.y=10;g.map='town';log(s,'庭でゴンザが寝ていた。「ここは…宇宙の中心か？」')}
 else if(r<.8){s.maps.town.items.push({k:LOOT[ri(s,LOOT.length)],x:7,y:9});log(s,'玄関の前に何か置いてある。')}}
const has=(p,k,n=1)=>p.inv.filter(x=>x==k).length>=n;
function take(p,k,n=1){for(let i=0;i<n;i++)p.inv.splice(p.inv.indexOf(k),1)}
function gain(s,p,k){p.inv.push(k);if(!s.codex[k]){s.codex[k]=1;log(s,'図鑑に「'+ITEMS[k].n+'」が登録された！')}else s.codex[k]++}
const patk=p=>p.atk+(p.wpn?ITEMS[p.wpn].atk:0);
function talk(s,p,n){n.dir=p.x>n.x?'right':p.x<n.x?'left':p.y<n.y?'up':'down';
 if(n.vis){log(s,n.vis.n+'「'+n.vis.line+'」');gain(s,p,n.vis.gift);log(s,ITEMS[n.vis.gift].n+'をもらった。');s.npcs=s.npcs.filter(x=>x!==n);return}
 const d=NPC_DEF[n.id],q=s.quest;
 if(q&&q.from==n.id&&has(p,q.k,q.n)){take(p,q.k,q.n);s.gold+=q.reward;log(s,d.n+'「おお、'+ITEMS[q.k].n+'！ これで夢が一つ叶う。どんな夢かは秘密だ。」');log(s,'依頼達成！ '+q.reward+'G もらった。');s.quest=null;return}
 if(n.id=='tanekichi'&&p.seedDay!=s.day){p.seedDay=s.day;const k=rng(s)<.5?'sTurnip':'sTomato';gain(s,p,k);log(s,d.n+'「'+d.lines[1]+'」('+ITEMS[k].n+'をもらった)');return}
 const i=(p.talk[n.id]||0);p.talk[n.id]=i+1;log(s,d.n+'「'+d.lines[i%d.lines.length]+'」')}
function kill(s,p,m,e){m.mons=m.mons.filter(o=>o!==e);p.exp+=e.maxhp;log(s,e.n+'を倒した。');
 if(p.exp>=p.lv*12){p.exp=0;p.lv++;p.maxhp+=5;p.hp=p.maxhp;p.atk++;log(s,'レベルが上がった！(Lv'+p.lv+')')}
 if(rng(s)<.4){m.items.push({k:LOOT[ri(s,LOOT.length)],x:e.x,y:e.y});log(s,'何か落とした。')}}
// ================= リアルタイム・シミュレーション =================
// update(state, inputs, dt): 固定タイムステップで呼ぶ。inputs = {playerId: {dx,dy,action,cmds}}。
// 状態は純粋データのみ(関数・DOMなし)。乱数は state.seed から。サーバー権威/クライアント予測で同じ関数を回せる。
const TILE=16,TIME_SCALE=10,P_SPEED=70,DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function syncPos(e){if(e.px==null||Math.floor(e.px/16)!=e.x||Math.floor(e.py/16)!=e.y){e.px=e.x*16+8;e.py=e.y*16+12}}
function syncAll(s){for(const e of s.players)syncPos(e);for(const e of s.npcs)syncPos(e);for(const e of s.allies)syncPos(e);
 const act=new Set(s.players.map(p=>p.map));for(const mid of act)for(const e of s.maps[mid].mons)syncPos(e)}
function ev(s,pid,o){(s.events||(s.events=[])).push({pid,...o})}
function solid(s,mid,x,y){const m=s.maps[mid];if(x<0||y<0||x>=m.w||y>=m.h)return true;if(BLOCK.includes(m.grid[y][x]))return true;
 return s.decor.some(d=>d.map==mid&&d.x==x&&d.y==y)||!!propAt(mid,x,y)}
function boxHit(s,mid,px,py,hw,hh,avoid){const x0=Math.floor((px-hw)/16),x1=Math.floor((px+hw-.01)/16),y0=Math.floor((py-hh)/16),y1=Math.floor((py-.01)/16);
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(solid(s,mid,x,y)||(avoid&&avoid(x,y)))return true;return false}
// 足元の小さい箱で軸ごとに移動 → 壁ずり。角に少し引っかかった時は横にずらす補助つき
function moveEnt(s,mid,e,vx,vy,dt,hw=5,hh=5,avoid){const ox=e.px,oy=e.py;
 if(vx){const nx=e.px+vx*dt;if(!boxHit(s,mid,nx,e.py,hw,hh,avoid))e.px=nx;else if(!vy){for(const n of[3,-3,6,-6])if(!boxHit(s,mid,nx,e.py+n,hw,hh,avoid)&&!boxHit(s,mid,e.px,e.py+n,hw,hh,avoid)){e.py+=Math.sign(n)*Math.min(Math.abs(vx*dt),Math.abs(n));break}}}
 if(vy){const ny=e.py+vy*dt;if(!boxHit(s,mid,e.px,ny,hw,hh,avoid))e.py=ny;else if(!vx){for(const n of[3,-3,6,-6])if(!boxHit(s,mid,e.px+n,ny,hw,hh,avoid)&&!boxHit(s,mid,e.px+n,e.py,hw,hh,avoid)){e.px+=Math.sign(n)*Math.min(Math.abs(vy*dt),Math.abs(n));break}}}
 e.x=Math.floor(e.px/16);e.y=Math.floor(e.py/16);return e.px!=ox||e.py!=oy}
const dirOf=(vx,vy)=>Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy<0?'up':'down');
function targetTile(p){const[fx,fy]=DIRV[p.dir||'down'];return[Math.floor((p.px+fx*12)/16),Math.floor((p.py-4+fy*12)/16)]}
const nearT=(e,tx,ty,r=11)=>Math.hypot(e.px-(tx*16+8),e.py-(ty*16+12))<r;
const dist=(a,b)=>Math.hypot(a.px-b.px,a.py-b.py)||.001;
const decay=(v,dt)=>Math.abs(v)<1?0:v*Math.exp(-12*dt);
function hurtPlayer(s,t,dmg,from){if(t.iframe>0)return;t.hp-=dmg;t.iframe=1;const d=dist(t,from);t.kvx=(t.px-from.px)/d*160;t.kvy=(t.py-from.py)/d*160;
 ev(s,t.id,{type:'pop',px:t.px,py:t.py-20,txt:'-'+dmg,col:'#f66'});
 if(t.hp<=0){log(s,from.n+'にやられた…ミツコに家まで引きずられた。');t.hp=t.maxhp;t.kvx=t.kvy=0;goMap(s,t,{to:'home',x:3,y:3});syncPos(t);t.lastTile=t.x+','+t.y;s.time+=120;
  if(t.inv.length){const l=t.inv.splice(ri(s,t.inv.length),1)[0];log(s,'途中で'+ITEMS[l].n+'を落とした。')}}}
function swing(s,p){const[fx,fy]=DIRV[p.dir];const hx=p.px+fx*13,hy=p.py-6+fy*13,m=s.maps[p.map];p.swing=.22;p.cd=.45;let hit=0;
 for(const e of[...m.mons]){if(e.tame)continue;if(Math.hypot(e.px-hx,e.py-6-hy)<15){const dmg=patk(p)+ri(s,3);e.hp-=dmg;e.hurt=.25;const d=dist(e,p);e.kvx=(e.px-p.px)/d*220;e.kvy=(e.py-p.py)/d*220;hit++;
  ev(s,p.id,{type:'pop',px:e.px,py:e.py-22,txt:''+dmg,col:'#fff'});if(e.hp<=0)kill(s,p,m,e)}}
 if(!hit)ev(s,p.id,{type:'swing'})}
function useAction(s,p){const m=s.maps[p.map],[tx,ty]=targetTile(p),t=(m.grid[ty]||[])[tx];p.cd=.3;
 const n=s.npcs.find(n=>n.map==p.map&&nearT(n,tx,ty,13));if(n){talk(s,p,n);return}
 const o=m.mons.find(e=>e.tame&&nearT(e,tx,ty,13));
 if(o){const lure=['jarashi','niboshi'].find(k=>has(p,k));
  if(lure||rng(s)<.3){if(lure)take(p,lure);m.mons=m.mons.filter(x=>x!==o);s.allies.push({owner:p.id,n:o.n+(s.allies.length+1)+'号',s:o.s,hp:o.maxhp+4,maxhp:o.maxhp+4,atk:o.atk,map:p.map,x:o.x,y:o.y,px:o.px,py:o.py});
   log(s,(lure?ITEMS[lure].n+'を差し出した。':'')+o.n+'がなついた！仲間になった。')}
  else{o.pet=(o.pet||0)+1;o.wt=1.5;o.wv=null;log(s,o.n+'を撫でた。'+(o.pet==1?'まだ警戒している。(煮干しや猫じゃらしがあれば…)':['ゴロゴロ…','しっぽが揺れた。','少し心を開いた気がする。'][o.pet%3]))}return}
 const it=m.items.findIndex(i=>i.x==tx&&i.y==ty);if(it>=0){const k=m.items.splice(it,1)[0].k;gain(s,p,k);log(s,ITEMS[k].n+'を拾った。');return}
 if(t=='b'){if(s.time<1080)log(s,'まだ眠くない。(18時以降に寝られる)');else{sleep(s,p);syncPos(p)}return}
 if(t=='B'){const q=s.quest;log(s,q?'掲示板「'+NPC_DEF[q.from].n+'より：'+ITEMS[q.k].n+'を'+q.n+'個ください。お礼 '+q.reward+'G」':'掲示板「本日の依頼はありません。猫を探しています(見つかりました)」');return}
 if(t=='W'){ev(s,p.id,{type:'ui',ui:'craft'});return}
 if(t=='X'){ev(s,p.id,{type:'ui',ui:'ship'});return}
 const fl={V:'自販機。「つめた〜い」の表示が全部「ぬる〜い」に書き換えられている。',P:'電柱。「ふとん 打ち直し」の看板が貼ってある。',R:'田んぼ。カエルがこちらを見ている。'}[t];if(fl){log(s,fl);return}
 if(t=='g'&&p.map=='town'){const key=tx+','+ty,f=s.farm[key];p.cd=.35;
  if(!f){s.farm[key]={crop:null,days:0,water:false};log(s,'土を耕した。')}
  else if(f.crop&&f.days>=f.need){const k=f.crop;delete s.farm[key];gain(s,p,k);if(rng(s)<.4)gain(s,p,k);log(s,ITEMS[k].n+'を収穫した！')}
  else if(f.crop&&!f.water){f.water=true;log(s,'水をやった。'+(f.need-f.days)+'日後に収穫できそう。')}
  else if(!f.crop){const sd=p.inv.find(k=>ITEMS[k].t=='seed');if(sd){take(p,sd);f.crop=ITEMS[sd].crop;f.need=ITEMS[sd].days;f.days=0;log(s,ITEMS[sd].n+'をまいた。')}else log(s,'種を持っていない。(種屋のタネ吉に話しかけよう)')}
  else log(s,'もう水はやった。寝ると育つ。');return}
 swing(s,p)}
function wanderVel(s,e,sp,dt){e.wt=(e.wt||0)-dt;if(e.wt<=0){e.wt=.8+rng(s)*1.8;e.wv=rng(s)<.45?null:[[1,0],[-1,0],[0,1],[0,-1]][ri(s,4)]}return e.wv?[e.wv[0]*sp,e.wv[1]*sp]:[0,0]}
function monAI(s,mid,e,dt){e.acd=Math.max(0,(e.acd||0)-dt);e.hurt=Math.max(0,(e.hurt||0)-dt);let vx=0,vy=0;
 if(e.tame){[vx,vy]=wanderVel(s,e,16,dt)}
 else{const ts=[...s.players.filter(p=>p.map==mid),...s.allies.filter(a=>a.map==mid&&!a.down)];let t=null,bd=112;for(const c of ts){const d=dist(e,c);if(d<bd){bd=d;t=c}}
  if(t&&e.hurt<=0){const sp=e.erratic?52:28+(e.tier||0)*9;vx=(t.px-e.px)/bd*sp;vy=(t.py-e.py)/bd*sp;
   if(e.erratic){e.jt=(e.jt||0)-dt;if(e.jt<=0){e.ja=(rng(s)-.5)*2.6;e.jt=.3}const c=Math.cos(e.ja),sn=Math.sin(e.ja);[vx,vy]=[vx*c-vy*sn,vx*sn+vy*c]}
   if(bd<12){vx*=.2;vy*=.2;if(e.acd<=0){e.acd=1.1;const dmg=Math.max(1,e.atk-ri(s,2));
    if(t.id)hurtPlayer(s,t,dmg,e);else{t.hp-=dmg;ev(s,t.owner,{type:'pop',px:t.px,py:t.py-16,txt:'-'+dmg,col:'#fa8'});if(t.hp<=0){t.down=true;t.map='home';log(s,t.n+'は逃げ帰った…(寝ると回復)')}}}}}
  else if(!t)[vx,vy]=wanderVel(s,e,14,dt)}
 if(vx||vy)e.dir=dirOf(vx,vy);e.moving=!!(vx||vy);
 vx+=e.kvx||0;vy+=e.kvy||0;e.kvx=decay(e.kvx||0,dt);e.kvy=decay(e.kvy||0,dt);moveEnt(s,mid,e,vx,vy,dt,4,4)}
function allyAI(s,a,o,dt){a.acd=Math.max(0,(a.acd||0)-dt);const m=s.maps[a.map];let vx=0,vy=0;
 let t=null,bd=64;for(const e of m.mons)if(!e.tame){const d=dist(a,e);if(d<bd&&dist(o,e)<96){bd=d;t=e}}
 if(t){vx=(t.px-a.px)/bd*85;vy=(t.py-a.py)/bd*85;if(bd<13){vx=vy=0;if(a.acd<=0){a.acd=.8;const dmg=a.atk+ri(s,2);t.hp-=dmg;t.hurt=.2;t.kvx=(t.px-a.px)/bd*120;t.kvy=(t.py-a.py)/bd*120;
   ev(s,o.id,{type:'pop',px:t.px,py:t.py-22,txt:''+dmg,col:'#fc6'});if(t.hp<=0){log(s,a.n+'が'+t.n+'をやっつけた。');kill(s,o,m,t)}}}}
 else{const d=dist(a,o);if(d>160){a.px=o.px;a.py=o.py;a.x=o.x;a.y=o.y}else if(d>30){vx=(o.px-a.px)/d*75;vy=(o.py-a.py)/d*75}else[vx,vy]=wanderVel(s,a,12,dt)}
 if(vx||vy)a.dir=dirOf(vx,vy);a.moving=!!(vx||vy);moveEnt(s,a.map,a,vx,vy,dt,4,4)}
function npcAI(s,n,dt){const m=s.maps[n.map],pl=s.players.find(p=>p.map==n.map&&dist(p,n)<26);let vx=0,vy=0;
 if(pl){n.moving=false;return}
 if(!n.vis)[vx,vy]=wanderVel(s,n,22,dt);if(vx||vy)n.dir=dirOf(vx,vy);
 const avoid=(x,y)=>m.grid[y][x]=='g'||!!m.links[x+','+y];n.moving=moveEnt(s,n.map,n,vx,vy,dt,4,4,avoid);if(!n.moving&&(vx||vy))n.wt=0}
function update(s,inputs,dt){syncAll(s);s.t=(s.t||0)+dt;s.time+=dt*TIME_SCALE;
 for(const p of s.players){const inp=inputs[p.id]||{};p.cd=Math.max(0,(p.cd||0)-dt);p.iframe=Math.max(0,(p.iframe||0)-dt);p.swing=Math.max(0,(p.swing||0)-dt);
  let dx=inp.dx||0,dy=inp.dy||0;const mg=Math.hypot(dx,dy);if(mg>1){dx/=mg;dy/=mg}
  if(mg>.15)p.dir=dirOf(dx,dy);let sp=P_SPEED*(p.swing>0?.35:1);let vx=dx*sp+(p.kvx||0),vy=dy*sp+(p.kvy||0);p.kvx=decay(p.kvx||0,dt);p.kvy=decay(p.kvy||0,dt);
  p.moving=moveEnt(s,p.map,p,vx,vy,dt,5,5)&&mg>.15;
  const tk=p.x+','+p.y;if(p.lastTile==null)p.lastTile=tk;else if(tk!=p.lastTile){p.lastTile=tk;const L=s.maps[p.map].links[tk];
   if(L){goMap(s,p,L);syncPos(p);p.lastTile=p.x+','+p.y;for(const a of s.allies)syncPos(a)}}
  const m=s.maps[p.map];for(let i=m.items.length-1;i>=0;i--){const it=m.items[i];if(Math.hypot(it.x*16+8-p.px,it.y*16+10-p.py)<9){m.items.splice(i,1);gain(s,p,it.k);log(s,ITEMS[it.k].n+'を拾った。')}}
  if(inp.action&&p.cd<=0)useAction(s,p);
  if(inp.cmds)for(const c of inp.cmds)applyCmd(s,p.id,c);
  p.rg=(p.rg||0)+dt;if(p.rg>8){p.rg=0;if(p.hp<p.maxhp)p.hp++}}
 const act=new Set(s.players.map(p=>p.map));
 for(const mid of act)for(const e of[...s.maps[mid].mons])monAI(s,mid,e,dt);
 for(const a of s.allies){if(a.down)continue;const o=s.players.find(p=>p.id==a.owner);if(o&&a.map==o.map)allyAI(s,a,o,dt)}
 for(const n of s.npcs)npcAI(s,n,dt);
 if(s.time>=26*60){const p=s.players[0];goMap(s,p,{to:'home',x:3,y:3});sleep(s,p,true);syncPos(p);p.lastTile=p.x+','+p.y}
 return s}
// ===== メニュー等の離散コマンド: applyCmd(state, playerId, cmd)（状態を直接更新）/ applyAction は複製して返す版 =====
function applyCmd(s,pid,a){const p=s.players.find(q=>q.id==pid);if(!p)return s;const m=s.maps[p.map];
 if(a.type=='use'){const k=p.inv[a.i],d=ITEMS[k];
  if(d&&d.t=='food'){take(p,k);p.hp=Math.min(p.maxhp+(d.maxhp||0),p.hp+d.heal);if(d.maxhp){p.maxhp+=d.maxhp;log(s,'最大HPが上がった。')}log(s,d.n+'を食べた。おいしい…気がする。')}
  else if(d&&d.t=='tool'){if(p.wpn)p.inv.push(p.wpn);take(p,k);p.wpn=k;log(s,d.n+'を装備した。')}else log(s,'それは使えない。')}
 else if(a.type=='decorate'){const k=p.inv[a.i];if(p.map!='home')log(s,'飾るのは家でだけ。');else if(k){
   const[tx,ty]=targetTile(p);const ok=(x,y)=>m.grid[y]&&m.grid[y][x]=='.'&&!solid(s,'home',x,y)&&!m.links[x+','+y]&&!(x==p.x&&y==p.y);
   const spot=ok(tx,ty)?[tx,ty]:[[0,-1],[1,0],[-1,0],[0,1]].map(([dx,dy])=>[p.x+dx,p.y+dy]).find(([x,y])=>ok(x,y));
   if(spot){take(p,k);s.decor.push({k,map:'home',x:spot[0],y:spot[1]});log(s,ITEMS[k].n+'を飾った。部屋が少し味わい深くなった。')}else log(s,'置く場所がない。(空いている床の方を向いて)')}}
 else if(a.type=='undecorate'){const[tx,ty]=targetTile(p);let i=s.decor.findIndex(d=>d.map==p.map&&d.x==tx&&d.y==ty);if(i<0)i=s.decor.findIndex(d=>d.map==p.map&&Math.abs(d.x-p.x)+Math.abs(d.y-p.y)==1);
  if(i>=0){p.inv.push(s.decor.splice(i,1)[0].k);log(s,'飾りを片付けた。')}else log(s,'近くに飾りがない。')}
 else if(a.type=='craft'){const r=RECIPES[a.r];const nearW=[[0,1],[0,-1],[1,0],[-1,0],[0,0]].some(([dx,dy])=>(m.grid[p.y+dy]||[])[p.x+dx]=='W');
  if(!nearW)log(s,'作業台の近くでないと作れない。');else if(r&&Object.entries(r.need).every(([k,n])=>has(p,k,n))){for(const[k,n]of Object.entries(r.need))take(p,k,n);gain(s,p,r.out);log(s,ITEMS[r.out].n+'を作った！');s.time+=30}else log(s,'材料が足りない。')}
 else if(a.type=='ship'){const k=p.inv[a.i];const near=[[0,1],[0,-1],[1,0],[-1,0]].some(([dx,dy])=>(m.grid[p.y+dy]||[])[p.x+dx]=='X');
  if(!near)log(s,'出荷箱の近くで。');else if(k){take(p,k);(s.shipped=s.shipped||[]).push(k);log(s,ITEMS[k].n+'を出荷箱に入れた。(明朝 '+price(k)+'G)')}}
 else if(a.type=='setLook'){p.look=a.look}
 else if(a.type=='join'){if(!s.players.find(q=>q.id==a.id))s.players.push(newPlayer(a.id,a.name,a.look))}
 return s}

document.querySelectorAll('#btns button[data-a]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));
function readInput(){const kx=(keys.has('r')?1:0)-(keys.has('l')?1:0),ky=(keys.has('d')?1:0)-(keys.has('u')?1:0);return(kx||ky)?{dx:kx,dy:ky}:{dx:stick.dx,dy:stick.dy}}
// ---- メインループ(固定タイムステップ60Hz) ----
let acc=0,last=performance.now(),lastSave=0,running=true;
function drainEvents(){if(!state.events||!state.events.length)return;for(const e of state.events){if(e.pid!=ME)continue;
 if(e.type=='ui'){if(e.ui=='craft')craft();else if(e.ui=='ship')ship()}else if(e.type=='pop')popups.push({...e,t:.8})}state.events=[]}
function loop(now){requestAnimationFrame(loop);let dtr=Math.min(.25,(now-last)/1000);last=now;if(!state)return;
 if(ov.style.display!='flex'&&!document.hidden){acc+=dtr;while(acc>=DT){acc-=DT;const i=readInput();update(state,{[ME]:{dx:i.dx,dy:i.dy,action:actEdge}},DT);actEdge=false;drainEvents();if(ov.style.display=='flex'){acc=0;break}}
  for(const o of popups)o.t-=dtr;popups=popups.filter(o=>o.t>0)}else acc=0;
 render();if(now-lastSave>3000){save();lastSave=now}}
requestAnimationFrame(loop);
function menu(){const p=state.players.find(q=>q.id==ME);const b=p.inv.map((k,i)=>{const d=ITEMS[k],act=d.t=='food'?'食べる':d.t=='tool'?'装備':p.map=='home'?'飾る':'';
  return[d.g+' '+d.n+(act?'（'+act+'）':''),()=>{close();if(act)dispatch({type:d.t=='food'||d.t=='tool'?'use':'decorate',i})},!act]});
 if(p.map=='home')b.push(['前の飾りを片付ける',()=>{close();dispatch({type:'undecorate'})}]);
 b.push(['図鑑',codex],['閉じる',close],['最初からやり直す',()=>{if(confirm('セーブを消して最初から？')){localStorage.removeItem(SAVE);location.reload()}}]);
 const q=state.quest;overlay('<b>持ち物</b> 装備:'+(p.wpn?ITEMS[p.wpn].n:'素手')+(q?'<div style="color:#fc8">依頼: '+NPC_DEF[q.from].n+'へ '+ITEMS[q.k].n+'×'+q.n+'</div>':'')+(p.inv.length?'':'<div>何も持っていない。</div>'),b)}
function icon(k){const r=SP[ITEM_SP[k]];if(!r)return '<span style="display:inline-block;width:32px;text-align:center;color:'+ITEMS[k].c+'">'+ITEMS[k].g+'</span>';
 return '<span style="display:inline-block;width:32px;height:32px;vertical-align:middle;image-rendering:pixelated;background:url('+SHEET.src+') -'+r[0]*2+'px -'+r[1]*2+'px/'+SHEET.width*2+'px '+SHEET.height*2+'px"></span>'}
function codex(){overlay('<b>図鑑 '+Object.keys(state.codex).length+'/'+Object.keys(ITEMS).length+'</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 8px">'+Object.entries(ITEMS).map(([k,d])=>'<div style="font-size:12px">'+(state.codex[k]?icon(k)+' '+d.n+' ×'+state.codex[k]:'<span style="display:inline-block;width:32px;height:32px;vertical-align:middle;background:#111;text-align:center;line-height:32px">？</span> ？？？')+'</div>').join('')+'</div>',[['閉じる',close]])}
function craft(){const p=state.players.find(q=>q.id==ME),m=state.maps[p.map];const near=[[0,1],[0,-1],[1,0],[-1,0]].some(([dx,dy])=>(m.grid[p.y+dy]||[])[p.x+dx]=='W');
 overlay('<b>作業台</b>'+(near?'':'<div style="color:#f88">家の作業台の隣で使えます</div>'),[...RECIPES.map((r,i)=>{const ok=Object.entries(r.need).every(([k,n])=>has(p,k,n));
  return[ITEMS[r.out].n+' ← '+Object.entries(r.need).map(([k,n])=>ITEMS[k].n+'×'+n).join('+')+' 【'+r.d+'】',()=>{close();dispatch({type:'craft',r:i})},!ok||!near]}),['閉じる',close]])}
function ship(){const p=state.players.find(q=>q.id==ME);overlay('<b>出荷箱</b><div>入れた物は翌朝お金になる。(入れ済み '+((state.shipped||[]).length)+'個)</div>',[...p.inv.map((k,i)=>[ITEMS[k].n+' → '+price(k)+'G',()=>{dispatch({type:'ship',i});ship()}]),['閉じる',close]])}
function help(){overlay('<b>あそびかた</b><div>移動: 左下のスティック / WASD・矢印(斜めもOK)。<br>使う(Space/Enter/E): 向いている前のマスを調べる。住人と話す・動物を撫でる・拾う・畑(耕す→種まき→水やり→収穫)・布団で寝る(18時〜)・掲示板・作業台・出荷箱。何もなければモップを振って攻撃。<br>敵に触れるとダメージ。少しの間は無敵。<br>☰(I/Esc): 持ち物 / 作(F): クラフト / 図(C): 図鑑<br>実1秒 = ゲーム10分。26時になると倒れて寝る。</div>',[['閉じる',close]])}
let ccLook=null,ccTimer=null;
function charCreate(){ccLook=ccLook||{...DEFAULT_LOOK};const rows=[['body','体型'],['skin','肌の色'],['hair','髪型'],['hairColor','髪の色'],['clothes','服'],['clothesColor','服の色'],['acc','頭の小物']];
 ovb.innerHTML='<b>キャラクターをつくる</b><div style="display:flex;justify-content:center;margin:6px 0"><canvas id="ccv" width="96" height="192" style="width:96px;height:192px;image-rendering:pixelated;background:#3a3440;border-radius:8px"></canvas></div>'+
 '<div>名前: <input id="ccn" value="'+(document.getElementById('nm')?.value||'清掃員カナタ')+'" style="font-size:16px;width:65%"></div>'+
 rows.map(([k,l])=>'<div style="display:flex;align-items:center;gap:6px;margin:5px 0"><span style="width:70px;font-size:13px">'+l+'</span><button class="cc" data-k="'+k+'" data-d="-1" style="width:48px;height:40px;text-align:center;margin:0">◀</button><span id="cc_'+k+'" style="flex:1;text-align:center"></span><button class="cc" data-k="'+k+'" data-d="1" style="width:48px;height:40px;text-align:center;margin:0">▶</button></div>').join('');
 const upd=()=>{for(const[k]of rows){const o=LOOK_OPT[k],i=o.findIndex(v=>v[0]===ccLook[k]);const cell=document.getElementById('cc_'+k);cell.textContent=o[Math.max(0,i)][1];
  const col=k.endsWith('Color')&&ccLook[k];cell.style.color=col||'#eee';cell.style.textShadow=col?'0 0 2px #ddd,0 0 1px #fff':''}};
 ovb.querySelectorAll('.cc').forEach(b=>b.onclick=()=>{const k=b.dataset.k,o=LOOK_OPT[k],i=o.findIndex(v=>v[0]===ccLook[k]);ccLook[k]=o[(i+ +b.dataset.d+o.length)%o.length][0];upd()});
 for(const[l,fn]of[['おすすめ(カナタ風)',()=>{ccLook={...DEFAULT_LOOK};upd()}],['ランダム',()=>{ccLook=randomLook();upd()}],['この姿ではじめる',()=>{clearInterval(ccTimer);const nm=document.getElementById('ccn').value||'清掃員カナタ';
   state=newState(nm,null,{...ccLook});localStorage.setItem(SAVE,JSON.stringify(state));close();render()}],['もどる',()=>{clearInterval(ccTimer);title()}]]){const b=document.createElement('button');b.textContent=l;b.onclick=fn;ovb.appendChild(b)}
 upd();ov.style.display='flex';let tick=0;clearInterval(ccTimer);
 const draw=()=>{const c=document.getElementById('ccv');if(!c)return;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,96,192);const dir=['down','right','up','left'][Math.floor(tick/4)%4];g.drawImage(lookCanvas(ccLook,dir,tick%2?'b':'a'),0,0,96,192);tick++};
 draw();ccTimer=setInterval(draw,350)}
function title(){overlay('<h1>廃ビルと清掃員</h1><div style="text-align:center">〜Elona風ゆるローグライク 試作v7 リアルタイム〜</div><p>名前: <input id="nm" value="清掃員カナタ" style="font-size:16px;width:60%"></p><div style="text-align:center;font-size:12px;color:#aaa">制作: 清掃員工房 / カナタゲームズ</div>'+(standalone?'':'<button id="fsb" onclick="goFull()" style="text-align:center">⛶ 全画面であそぶ</button><div id="iosg" style="display:none;font-size:12px;color:#fc8;margin:4px 0">iPhone/iPadでは、Safariの共有ボタン(□↑)→「ホーム画面に追加」で全画面のアプリとして遊べます。</div>'),
 [...(state?[['つづきから',()=>{close();render()}]]:[]),['はじめから',()=>charCreate()]])}
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
async function goFull(){const el=document.documentElement;
 if(el.requestFullscreen||el.webkitRequestFullscreen){try{await (el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen());try{await screen.orientation.lock('portrait')}catch(e){}}catch(e){}}
 if(isIOS&&!standalone){const g=document.getElementById('iosg');if(g)g.style.display='block'}}
resize();title();
</script></body></html>
